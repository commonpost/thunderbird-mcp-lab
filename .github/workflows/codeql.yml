name: CodeQL

# Static analysis of the harness, the fuzz target and the workflows themselves.
# Advanced setup (not GitHub's default setup), because the default setup does not analyse pull requests opened by
# Dependabot: the "Analyze (...)" checks required on main never appeared there, which blocked those pull requests.
# The job names match those required checks, and the categories match the ones the default setup used, so existing
# alerts carry over.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # findings as code scanning alerts
      actions: read # CodeQL reads the workflow run metadata
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
